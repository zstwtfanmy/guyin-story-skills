name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check (node --check)
        run: |
          node --check skills/guyin-write/scripts/guyin-check-degeneration.js
          node --check skills/guyin-write/scripts/guyin-check-ai-patterns.js
          node --check skills/guyin-write/scripts/guyin-check-integrity.js
          node --check skills/guyin-write/scripts/guyin-check-outline-verdict.js
          node --check skills/guyin-write/scripts/guyin-check-narrative-asset.js
          node --check skills/guyin-write/scripts/guyin-check-consistency.js
          node --check skills/guyin-write/scripts/guyin-check-beat.js
          node --check skills/guyin-write/scripts/guyin-check-outline-copy.js
          node --check skills/guyin-write/scripts/guyin-check-wordcount.js
          node --check skills/guyin-write/scripts/guyin-check-hook-rotation.js
          node --check skills/guyin-write/scripts/guyin-check-repetition.js
          node --check skills/guyin-write/scripts/guyin-check-flesh.js
          node --check skills/guyin-write/scripts/guyin-impact-map.js
          node --check skills/guyin-write/scripts/guyin-check-reader-signal.js
          node --check skills/guyin-write/scripts/guyin-check-pitch.js
          node --check skills/guyin-write/scripts/guyin-check-outline-slots.js
          node --check skills/guyin-write/scripts/guyin-check-outline-deliver.js
          node --check skills/guyin-write/scripts/guyin-check-strip.js
          node --check skills/guyin-write/scripts/guyin-check-authority-leak.js
          node --check skills/guyin-write/scripts/guyin-check-pending.js
          node --check skills/guyin-write/scripts/guyin-normalize-punctuation.js
          node --check skills/guyin-setup/scripts/merge-claude-settings.js
          node --check skills/guyin-setup/templates/long/.claude/hooks/guyin-hook.js
          node --check scripts/check-doc-budget.js
          node --check scripts/check-skill-contracts.js

      - name: SKILL structural contracts
        run: node scripts/check-skill-contracts.js

      - name: Hot-path doc budget
        run: node scripts/check-doc-budget.js

      - name: Runtime script regression tests
        run: node tests/run-tests.js
